name: E2E production system test

on:
  workflow_dispatch:
    inputs:
      do_purchase:
        description: "Run a REAL purchase (spends wallet balance)? yes/no"
        default: "no"
      country:
        description: "Country for the test purchase"
        default: "JP"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke-test all routes
        run: |
          BASE="https://privasim-two.vercel.app"
          FAIL=0
          for path in / /shop /shop/global /shop/JP /blog /blog/best-esim-deals-today \
                      /guide /topup /orders /privacy /admin /sitemap.xml /robots.txt /llms.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            printf "[%s] %s\n" "$code" "$path"
            [ "$code" = "200" ] || { echo "  ^ FAIL"; FAIL=1; }
          done
          [ "$FAIL" = "0" ] && echo "ALL ROUTES OK" || echo "SOME ROUTES FAILED"

      - name: Verify persistent ledger is active
        env:
          KEY: ${{ secrets.PIKASIM_API_KEY }}
        run: |
          echo "===== admin discounts (should report persistent:true) ====="
          curl -sS "https://privasim-two.vercel.app/api/admin/discounts" -H "x-admin-key: $KEY" | head -c 500
          echo

      - name: Diagnostic — env + MCP connectivity + wallet balance
        env:
          KEY: ${{ secrets.PIKASIM_API_KEY }}
        run: |
          echo "===== /api/test/pikasim (env, MCP, balance) ====="
          curl -sS "https://privasim-two.vercel.app/api/test/pikasim?key=$KEY" \
            | sed 's/<[^>]*>//g' | grep -vE '^\s*$' | head -60

      - name: Discount code lifecycle (create → validate → revoke → reject)
        env:
          KEY: ${{ secrets.PIKASIM_API_KEY }}
        run: |
          B="https://privasim-two.vercel.app"
          echo "1) create maxUses=3"
          CODE=$(curl -sS -X POST "$B/api/admin/discounts" -H "x-admin-key: $KEY" -H "Content-Type: application/json" \
            -d '{"label":"E2ETEST","percent":15,"validDays":1,"maxUses":3}' | python3 -c "import sys,json;print(json.load(sys.stdin)['code'])")
          echo "   code=$CODE"
          echo "2) validate (expect valid:true)"
          curl -sS -X POST "$B/api/discount/validate" -H "Content-Type: application/json" -d "{\"code\":\"$CODE\"}"; echo
          echo "3) revoke"
          curl -sS -X PATCH "$B/api/admin/discounts" -H "x-admin-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"code\":\"$CODE\",\"revoked\":true}" >/dev/null
          echo "4) validate again (expect valid:false, deactivated)"
          curl -sS -X POST "$B/api/discount/validate" -H "Content-Type: application/json" -d "{\"code\":\"$CODE\"}"; echo

      - name: REAL purchase (optional)
        if: ${{ github.event.inputs.do_purchase == 'yes' }}
        env:
          KEY: ${{ secrets.PIKASIM_API_KEY }}
        run: |
          B="https://privasim-two.vercel.app"
          C="${{ github.event.inputs.country }}"
          echo "Finding cheapest $C data package…"
          CODE=$(curl -sS "$B/api/test/buy?key=$KEY&country=$C" | grep -oE 'package=[^"&]+' | head -1 | cut -d= -f2)
          echo "Cheapest package: $CODE"
          [ -z "$CODE" ] && { echo "No package found"; exit 1; }
          echo "===== Purchasing $CODE (spends wallet) ====="
          curl -sS "$B/api/test/buy?key=$KEY&package=$CODE" | sed 's/<[^>]*>//g' | grep -vE '^\s*$' | head -40
