name: Probe PikaSim docs and live site

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: REST API discovery — package structure, regions, phone/global plans
        run: |
          echo "===== sample package objects (first 2, full fields) ====="
          curl -sS "https://pikasim.com/api/packages/all-countries" \
            | python3 -c "
          import sys, json
          j = json.load(sys.stdin)
          pkgs = j.get('packages', [])
          print('total packages:', len(pkgs))
          print(json.dumps(pkgs[:2], indent=1)[:3000])
          types = {}
          locs = {}
          for p in pkgs:
            t = p.get('dataType') or p.get('type') or '?'
            types[t] = types.get(t, 0) + 1
            lc = p.get('locationCode') or p.get('destinationCode') or '?'
            locs[lc] = locs.get(lc, 0) + 1
          print('by type:', types)
          print('distinct locations:', len(locs))
          print('global-ish keys:', {k: v for k, v in locs.items() if not (len(k) == 2 and k.isalpha())})
          "
          echo "===== try region/global endpoints ====="
          for u in \
            "https://pikasim.com/api/packages/global" \
            "https://pikasim.com/api/packages/region/global" \
            "https://pikasim.com/api/packages/all-countries?region=global" \
            "https://pikasim.com/api/packages/all-countries?regionSlug=global" \
            "https://pikasim.com/api/phone-plans" \
            "https://pikasim.com/api/packages/phone" \
            "https://pikasim.com/api/packages/all-countries?type=phone"; do
            code=$(curl -s -o /tmp/r -w "%{http_code}" "$u")
            size=$(wc -c < /tmp/r)
            summary=$(python3 -c "
          import json
          try:
            j = json.load(open('/tmp/r'))
            p = j.get('packages', j if isinstance(j, list) else [])
            print(f'{len(p)} pkgs' if isinstance(p, list) else str(j)[:120])
          except Exception:
            print(open('/tmp/r').read()[:100].replace(chr(10), ' '))
          ")
            echo "[$code] $u (${size}B) -> $summary"
          done
          echo "===== MCP search: global phone plans (public tool) ====="
          curl -sS -X POST https://pikasim.com/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_phone_plans","arguments":{"region":"Global"}}}' | head -c 6000
          echo
          echo "===== MCP search: region Global data ====="
          curl -sS -X POST https://pikasim.com/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"search_esim_packages","arguments":{"region":"Global"}}}' | head -c 4000

      - name: Smoke-test live site routes
        run: |
          BASE="https://privasim.app"
          for path in / /shop /shop/JP /blog /orders /privacy /guide /topup /sitemap.xml; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$BASE$path")
            bytes=$(wc -c </tmp/body)
            echo "[$code] $path (${bytes}B)"
          done
