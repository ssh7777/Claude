name: Deploy to Vercel

on:
  push:
    branches: [main]

# Only the newest deploy runs; older in-flight runs are cancelled so rapid
# pushes + the daily cron can't pile up and jam Vercel's build queue (that
# pile-up is what caused a 6-hour "Building…" hang).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Hard ceiling so a stuck build can never hold the runner for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefix privasim

      - name: Deploy to Vercel
        run: |
          cd privasim
          npx vercel deploy --prod \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
