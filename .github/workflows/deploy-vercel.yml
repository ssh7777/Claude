name: Deploy to Vercel

on:
  push:
    branches: [main]

# Only the newest deploy runs; older in-flight deploys are cancelled so the
# build queue never backs up (this is what caused the 6-hour hang).
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project settings + env
        run: |
          cd privasim
          vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefix privasim

      # Build ON the runner (fast, ~2 min, fully under our control) instead of
      # waiting on Vercel's remote build queue — eliminates the deploy hang.
      - name: Build (prebuilt)
        run: |
          cd privasim
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt output to production
        run: |
          cd privasim
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
