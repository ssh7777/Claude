name: Deploy to Vercel (manual fallback)

# MANUAL ONLY. Vercel's GitHub integration auto-deploys every push (main →
# production, branches → preview). Running this on push as well created TWO
# deployments per commit, which tripped Vercel's Hobby-tier concurrency/
# anti-spam limits and jammed the queue (the BLOCKED deployments and 6-hour
# hangs). Keep this as a manual escape hatch only.
on:
  workflow_dispatch:

# Only the newest deploy runs; older in-flight runs are cancelled so rapid
# pushes + the daily cron can't pile up.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prebuilt deploys finish in ~5 min; anything longer is a real failure.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefix privasim

      # Link deterministically: fetch the project's real IDs from the Vercel
      # API instead of relying on `vercel link` inference. This is what makes
      # the prebuilt path safe.
      - name: Link Vercel project
        working-directory: privasim
        run: |
          mkdir -p .vercel
          curl -sS --fail "https://api.vercel.com/v9/projects/privasim" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "
          import sys, json
          p = json.load(sys.stdin)
          json.dump({'projectId': p['id'], 'orgId': p['accountId']}, open('.vercel/project.json', 'w'))
          print('Linked project', p['id'])
          "
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Pull production settings + env
        working-directory: privasim
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Build HERE on the runner — never in Vercel's shared build queue.
      # The queue is what hung every deploy from Jul 5–11 (runs cancelled at
      # the 20-min ceiling while `vercel deploy` waited on a remote build).
      - name: Build (prebuilt)
        working-directory: privasim
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        working-directory: privasim
        # --yes is REQUIRED: without it the CLI can stop at an interactive
        # prompt and hang forever in CI. </dev/null belt-and-braces so any
        # unexpected prompt EOFs instead of blocking.
        run: |
          URL=$(npx vercel deploy --prebuilt --prod --archive=tgz --yes --token "$VERCEL_TOKEN" </dev/null)
          echo "Deployed: $URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify production responds
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://privasim.app/)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "privasim.app did not return 200 after deploy" >&2
          exit 1
