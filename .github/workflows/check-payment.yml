name: Check ETH wallet for incoming payment

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Recent transactions to PRIVASIM ETH wallet
        run: |
          ADDR="0x87176027Cc61d260926dAAe68551e246260dc30E"
          echo "===== Blockscout: latest transactions ====="
          curl -sS "https://eth.blockscout.com/api/v2/addresses/$ADDR/transactions?filter=to" \
            | python3 -c "
          import sys, json
          j = json.load(sys.stdin)
          items = j.get('items', [])
          if not items:
            print('No incoming transactions found.', j.get('message',''))
          for t in items[:5]:
            eth = int(t.get('value','0')) / 1e18
            print(f\"hash={t.get('hash')}\")
            print(f\"  time={t.get('timestamp')} from={t.get('from',{}).get('hash')}\")
            print(f\"  value={eth:.8f} ETH status={t.get('status')} block={t.get('block_number')}\")
          "
          echo "===== Current balance (publicnode RPC) ====="
          curl -sS -X POST https://ethereum-rpc.publicnode.com \
            -H "Content-Type: application/json" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_getBalance\",\"params\":[\"$ADDR\",\"latest\"]}" \
            | python3 -c "import sys,json; j=json.load(sys.stdin); print(int(j.get('result','0x0'),16)/1e18, 'ETH')"
