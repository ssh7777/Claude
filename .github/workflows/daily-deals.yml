name: Daily content automation (deals + auto-article + SEO ping)

on:
  schedule:
    - cron: "0 6 * * *" # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate today's cheapest-deals data from live catalog
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime

          POPULAR = ["JP","US","GB","DE","FR","TH","SG","AU","KR","IT","ES","TR","AE","SE","NL"]

          req = urllib.request.Request(
              "https://pikasim.com/api/packages/all-countries",
              headers={"Accept": "application/json", "User-Agent": "privasim-deals-bot"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          pkgs = data.get("packages", [])

          best = {}
          for p in pkgs:
              cc = p.get("locationCode") or p.get("destinationCode") or ""
              if cc not in POPULAR:
                  continue
              price = p.get("priceUSD")
              vol = p.get("volumeGB") or 0
              if not price or not vol or vol < 0.9:
                  continue  # at least ~1GB plans
              per_gb = price / vol
              cur = best.get(cc)
              if cur is None or per_gb < cur["per_gb"]:
                  best[cc] = {
                      "per_gb": per_gb,
                      "deal": {
                          "countryCode": cc,
                          "country": p.get("location", cc).split(",")[0] if len(p.get("location", "")) < 40 else cc,
                          "name": p.get("name", ""),
                          "dataAmount": f'{p.get("volumeGB")} GB',
                          "days": p.get("duration") or p.get("validityDays") or 0,
                          "wholesaleUsd": round(price, 2),
                      },
                  }

          deals = [v["deal"] for v in sorted(best.values(), key=lambda x: x["per_gb"])][:10]
          out = {"date": datetime.date.today().isoformat(), "deals": deals}
          with open("privasim/data/daily-deals.json", "w") as f:
              json.dump(out, f, indent=1)
          print(f"wrote {len(deals)} deals for {out['date']}")
          EOF

      - name: Generate today's auto-article from live catalog
        run: node privasim/scripts/generate-article.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add privasim/data/daily-deals.json privasim/data/auto-articles.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            exit 0
          fi
          git commit -m "Daily content: deals + auto-article $(date -u +%F)"
          git push origin main

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver) for instant crawl
        continue-on-error: true
        run: |
          # IndexNow key is hosted at /<key>.txt on the site (public/ file).
          KEY="a7f3c1e9b2d4e6f8a0c2e4b6d8f0a1c3"
          BASE="https://privasim.app"
          for url in "$BASE/" "$BASE/blog" "$BASE/blog/best-esim-deals-today" "$BASE/shop" "$BASE/shop/global"; do
            curl -sS "https://api.indexnow.org/indexnow?url=${url}&key=${KEY}" -o /dev/null -w "IndexNow %{http_code} ${url}\n" || true
          done
