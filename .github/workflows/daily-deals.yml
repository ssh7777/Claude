name: Daily content automation (review by pull request)

on:
  schedule:
    - cron: "0 6 * * *" # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: daily-content-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare automated review branch
        env:
          BRANCH: automation/daily-content
        run: |
          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          git checkout -B "$BRANCH" origin/main

      - name: Generate today's cheapest-deals data from live catalog
        run: |
          python3 - <<'EOF'
          import json, urllib.request, datetime

          POPULAR = ["JP","US","GB","DE","FR","TH","SG","AU","KR","IT","ES","TR","AE","SE","NL"]

          req = urllib.request.Request(
              "https://pikasim.com/api/packages/all-countries",
              headers={"Accept": "application/json", "User-Agent": "privasim-deals-bot"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          pkgs = data.get("packages", [])

          best = {}
          for p in pkgs:
              cc = p.get("locationCode") or p.get("destinationCode") or ""
              if cc not in POPULAR:
                  continue
              price = p.get("priceUSD")
              vol = p.get("volumeGB") or 0
              if not price or not vol or vol < 0.9:
                  continue  # at least ~1GB plans
              per_gb = price / vol
              cur = best.get(cc)
              if cur is None or per_gb < cur["per_gb"]:
                  best[cc] = {
                      "per_gb": per_gb,
                      "deal": {
                          "countryCode": cc,
                          "country": p.get("location", cc).split(",")[0] if len(p.get("location", "")) < 40 else cc,
                          "name": p.get("name", ""),
                          "dataAmount": f'{p.get("volumeGB")} GB',
                          "days": p.get("duration") or p.get("validityDays") or 0,
                          "wholesaleUsd": round(price, 2),
                      },
                  }

          deals = [v["deal"] for v in sorted(best.values(), key=lambda x: x["per_gb"])][:10]
          out = {"date": datetime.date.today().isoformat(), "deals": deals}
          with open("privasim/data/daily-deals.json", "w") as f:
              json.dump(out, f, indent=1)
          print(f"wrote {len(deals)} deals for {out['date']}")
          EOF

      - name: Generate today's 3 auto-articles from live catalog
        run: node privasim/scripts/generate-article.mjs

      - name: Generate daily privacy-news roundup from public RSS feeds
        continue-on-error: true
        run: node privasim/scripts/generate-roundup.mjs

      - name: Validate generated JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("privasim/data/auto-articles.json", "utf8")); JSON.parse(require("node:fs").readFileSync("privasim/data/daily-deals.json", "utf8"))'

      - name: Open or update a review pull request
        env:
          BRANCH: automation/daily-content
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privasim/data/daily-deals.json privasim/data/auto-articles.json
          if git diff --cached --quiet; then
            echo "No generated content changes."
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$PR" ]; then
              gh pr close "$PR" --comment "Closing stale generated content: the current refresh has no changes against main." --delete-branch
            fi
            exit 0
          fi

          DATE=$(date -u +%F)
          TITLE="Daily content update — $DATE"
          BODY="Automated catalog/news content update for review. This workflow no longer commits generated content directly to main; merge only after the PR checks pass and copy is reviewed."
          git commit -m "Daily content update: $DATE"
          git push --force-with-lease origin "$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

          # GITHUB_TOKEN pushes do not trigger push/PR workflows automatically.
          # Explicitly dispatch the secret-free CI workflow for this branch.
          gh workflow run privasim-ci.yml --ref "$BRANCH"
